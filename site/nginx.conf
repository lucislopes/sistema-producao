server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location /api/ {
    client_max_body_size 5m;
    proxy_pass http://backend:3333/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /empresa { proxy_pass http://frontend:80; proxy_set_header Host $host; }
  location /assets/ { try_files $uri @frontend_assets; expires 7d; }
  location @frontend_assets { proxy_pass http://frontend:80; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ =404; }
}
