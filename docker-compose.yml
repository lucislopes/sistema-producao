services:
  postgres:
    image: postgres:16
    container_name: sistema-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema_producao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sistema-backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sistema_producao
      JWT_SECRET: sua_chave_secreta_aqui
      PORT: 3333
    ports:
      - "3333:3333"
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm start"

  frontend:
    build: ./frontend
    container_name: sistema-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data: